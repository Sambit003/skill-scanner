[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:skillspector-api]
command=/app/backend/.venv/bin/skillspector-api
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=appuser
environment=SKILLSPECTOR_DATA_DIR="/data",SKILLSPECTOR_DB_PATH="/data/skillspector.db",SKILLSPECTOR_WORK_DIR="/tmp/skillspector-scans",SKILLSPECTOR_API_HOST="127.0.0.1",SKILLSPECTOR_API_PORT="8000",SKILLSPECTOR_EMBEDDED_WORKER_ENABLED="true"

[program:frontend]
command=/usr/local/bin/node /app/frontend/server.js
directory=/app/frontend
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=appuser
environment=PORT="3000",HOSTNAME="127.0.0.1"

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
