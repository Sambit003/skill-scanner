services:
  api:
    build:
      context: ../SkillSpector
      target: api
    restart: unless-stopped
    environment:
      SKILLSPECTOR_DATA_DIR: /data
      SKILLSPECTOR_DB_PATH: /data/skillspector.db
      SKILLSPECTOR_WORK_DIR: /tmp/skillspector-scans
      SKILLSPECTOR_API_HOST: 0.0.0.0
      SKILLSPECTOR_API_PORT: "8000"
      SKILLSPECTOR_CORS_ORIGINS: ${SKILLSPECTOR_CORS_ORIGINS}
      SKILLSPECTOR_MAX_SCAN_TIMEOUT_SECONDS: ${SKILLSPECTOR_MAX_SCAN_TIMEOUT_SECONDS:-300}
      SKILLSPECTOR_EMBEDDED_WORKER_ENABLED: "true"
    volumes:
      - skillspector_data:/data
      - skillspector_work:/tmp/skillspector-scans
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SKILLSPECTOR_API_DOMAIN: ${SKILLSPECTOR_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  skillspector_data:
  skillspector_work:
  caddy_data:
  caddy_config:
