services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      SKILLSPECTOR_DATA_DIR: /data
      SKILLSPECTOR_WORK_DIR: /tmp/skillspector-scans
      SKILLSPECTOR_API_HOST: 0.0.0.0
      SKILLSPECTOR_API_PORT: "8000"
      SKILLSPECTOR_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SKILLSPECTOR_MAX_SCAN_TIMEOUT_SECONDS: "300"
    volumes:
      - skillspector-data:/data
      - skillspector-work:/tmp/skillspector-scans

  worker:
    build:
      context: .
      target: api
    entrypoint: ["skillspector-worker"]
    environment:
      SKILLSPECTOR_DATA_DIR: /data
      SKILLSPECTOR_WORK_DIR: /tmp/skillspector-scans
      SKILLSPECTOR_WORKER_POLL_SECONDS: "2.0"
      SKILLSPECTOR_MAX_SCAN_TIMEOUT_SECONDS: "300"
    volumes:
      - skillspector-data:/data
      - skillspector-work:/tmp/skillspector-scans

volumes:
  skillspector-data:
  skillspector-work:
