language: "go"
layer: "library"
stack: "systems"

dependsOn:
  - id: "scan-kernel-contracts"
    scope: "production"

tasks:
  setup:
    command: "go mod download"
    options:
      cache: false
      runInCI: false

  fmt-check:
    command: "go run ./cmd/checkfmt"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

  check:
    command: "go vet ./..."
    deps:
      - "fmt-check"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/contracts/**/*"

  test:
    command: "go test ./..."
    deps:
      - "scan-kernel-contracts:check"
    inputs:
      - "**/*.go"
      - "testdata/**/*"
      - "go.mod"
      - "go.sum"
      - "/contracts/**/*"

  build:
    command: "go build -trimpath -o dist/dev/scan-kernel-engine ./cmd/scankernel"
    deps:
      - "check"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "plugins/**/*.yar"
      - "plugins/**/*.yara"
    outputs:
      - "dist/dev/scan-kernel-engine"

  smoke:
    command: "go test ./internal/protocol -run TestProtocolSmoke -v"
    deps:
      - "build"
    options:
      cache: false

  contract:
    command: "go test ./internal/protocol -run TestContract -v"
    deps:
      - "scan-kernel-contracts:check"

  regression:
    command: "bash scripts/verify-regression.sh"
    toolchains: "system"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/verify-regression.sh"
      - "testdata/regression/**/*"
    options:
      cache: false
      runInCI: false

  bundle:
    command: "bash scripts/build-scanner.sh"
    toolchains: "system"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "build/**/*"
      - "scripts/**/*"
    options:
      cache: false
      runInCI: false
