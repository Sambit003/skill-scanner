services:
  # ============================================================================
  # 1. PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: riskdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: riskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riskdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riskdb-net

  # ============================================================================
  # 2. Redis Message Broker & Cache
  # ============================================================================
  redis:
    image: redis:alpine
    container_name: riskdb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riskdb-net

  # ============================================================================
  # 3. FastAPI Backend API
  # ============================================================================
  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: riskdb-backend-api
    restart: unless-stopped
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/riskdb"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      CELERY_TASK_ALWAYS_EAGER: "false"
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8000"]'
      SECRET_KEY: "riskdb-production-deployment-secret-key-change-me"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - riskdb-net

  # ============================================================================
  # 4. Celery Scan Worker
  # ============================================================================
  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: riskdb-backend-worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/riskdb"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      CELERY_TASK_ALWAYS_EAGER: "false"
      SECRET_KEY: "riskdb-production-deployment-secret-key-change-me"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.core.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - riskdb-net

  # ============================================================================
  # 5. Next.js Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riskdb-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NODE_ENV: "production"
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - riskdb-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  riskdb-net:
    driver: bridge
