[project]
name = "scanner-engine"
version = "0.1.0"
description = "Universal, decoupled scanner engine for AIRiskDB assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "yara-python>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
